services:

## Router
  router:
    image: mongo:4
    container_name: router
    command: mongos --port 27017 --configdb rs-config-server/192.168.30.58:25100,192.168.30.59:25100,192.168.30.62:25100 --bind_ip_all 
    ports:
      - 25200:27017
    restart: always
    volumes:
      - ./scripts:/scripts
      - mongodb_cluster_router_db:/data/db
      - mongodb_cluster_router_config:/data/configdb

## Config Servers
  configsvr:
    image: mongo:4
    container_name: configsvr
    command: mongod --port 27017 --configsvr --replSet rs-config-server --bind_ip_all
    volumes:
      - ./scripts:/scripts 
      - mongodb_cluster_configsvr_db:/data/db
      - mongodb_cluster_configsvr_config:/data/configdb
    ports:
      - 25100:27017
    restart: always

## Shards
  shard-01:
    image: mongo:4
    container_name: shard-01
    command: mongod --port 27017 --shardsvr --replSet rs-shard-01 --bind_ip_all
    volumes:
      - ./scripts:/scripts
      - mongodb_cluster_shard_01_db:/data/db
      - mongodb_cluster_shard_01_config:/data/configdb
    ports:
      - 25000:27017
    restart: always
  shard-02:
    image: mongo:4
    container_name: shard-02
    command: mongod --port 27017 --shardsvr --replSet rs-shard-02 --bind_ip_all
    volumes:
      - ./scripts:/scripts
      - mongodb_cluster_shard_02_db:/data/db
      - mongodb_cluster_shard_02_config:/data/configdb
    ports:
      - 25001:27017
    restart: always
  shard-03:
    image: mongo:4
    container_name: shard-03
    command: mongod --port 27017 --shardsvr --replSet rs-shard-03 --bind_ip_all
    volumes:
      - ./scripts:/scripts
      - mongodb_cluster_shard_03_db:/data/db
      - mongodb_cluster_shard_03_config:/data/configdb
    ports:
      - 25002:27017
    restart: always

volumes:
  mongodb_cluster_router_db:
  mongodb_cluster_router_config:
  
  mongodb_cluster_configsvr_db:
  mongodb_cluster_configsvr_config:
  
  mongodb_cluster_shard_01_db:
  mongodb_cluster_shard_01_config:
  
  mongodb_cluster_shard_02_db:
  mongodb_cluster_shard_02_config:
  
  mongodb_cluster_shard_03_db:
  mongodb_cluster_shard_03_config:
